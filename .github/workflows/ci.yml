name: CI/CD Pipeline — Nandhipriya Electricals

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB ReplicaSet Container
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:6.0 --replSet rs0 --bind_ip_all
          echo "Waiting for MongoDB to start..."
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do
            sleep 1
          done
          echo "Initiating ReplicaSet rs0..."
          docker exec mongodb mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          sleep 3

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Database Seeder
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/nandhipriya_electricals?replicaSet=rs0
        run: node utils/seedData.js

      - name: Execute 22-Endpoint Automated Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/nandhipriya_electricals?replicaSet=rs0
        run: npm run test:all

  frontend-build:
    name: Frontend Build & Compilation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vite Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build
